name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: pytest
      - name: Run unit-disk benchmark
        run: python -m tensorbem.benchmarks.unit_disk --panels 64
      - name: Run cylinder added-mass benchmark
        run: python -m tensorbem.benchmarks.cylinder_added_mass --panels 32
      - name: Generate reproducible refinement report
        run: python -m tensorbem.benchmarks.refinement_study --panels 16 32 64 128 --output artifacts/refinement-study.json
      - name: Generate analytical verification report
        run: python -m tensorbem.benchmarks.analytical_suite --panels 16 32 64 128 --output artifacts/analytical-study.json
      - name: Run sphere added-mass benchmark
        run: python -m tensorbem.benchmarks.sphere_added_mass --subdivisions 2
      - name: Run sphere velocity benchmark
        run: python -m tensorbem.benchmarks.sphere_velocity --subdivisions 2 --output artifacts/sphere-velocity.json
      - name: Generate the surface-velocity accuracy study
        run: python -m tensorbem.benchmarks.surface_velocity_study --levels 1 2 3 --output artifacts/surface-velocity-study.json
      - name: Generate three-dimensional verification report
        run: python -m tensorbem.benchmarks.three_dimensional_study --levels 0 1 2 3 --output artifacts/three-dimensional-study.json
      - name: Run elliptic-cylinder added-mass benchmark
        run: |
          python -m tensorbem.benchmarks.ellipse_added_mass --panels 64 --axis x
          python -m tensorbem.benchmarks.ellipse_added_mass --panels 64 --axis y
      - name: Run ellipsoid added-mass benchmark
        run: python -m tensorbem.benchmarks.ellipsoid_added_mass --subdivisions 2
      - name: Run Ursell submerged-cylinder radiation benchmark
        run: python -m tensorbem.benchmarks.ursell_cylinder --panels 64 --ka 0.6 --output artifacts/ursell.json
      - name: Generate classical benchmark study
        run: python -m tensorbem.benchmarks.classical_study --panels 16 32 64 128 --subdivisions 0 1 2 3 --harmonic-levels 1 2 3 --output artifacts/classical-study.json
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: tensorbem-verification-reports
          path: |
            artifacts/refinement-study.json
            artifacts/analytical-study.json
            artifacts/three-dimensional-study.json
            artifacts/sphere-velocity.json
            artifacts/surface-velocity-study.json
            artifacts/classical-study.json
          if-no-files-found: error
